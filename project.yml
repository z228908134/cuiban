name: Cuiban
options:
  bundleIdPrefix: com.cuiban
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ALWAYS_SEARCH_USER_PATHS: NO

targets:
  Cuiban:
    type: application
    platform: iOS
    sources:
      - path: Cuiban
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: 催办
        CFBundleName: Cuiban
        # 声明只支持简体中文：系统选择菜单（复制/粘贴/全选）跟随 App 语言，
        # 不声明的话会按手机系统语言显示英文
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations:
          - zh-Hans
        CFBundleShortVersionString: "1.12.1"
        CFBundleVersion: "52"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
          - fetch
        ITSAppUsesNonExemptEncryption: false
        # 同步 NAS 走 WebDAV。局域网内用 http 直连时 ATS 会拦，
        # NSAllowsLocalNetworking 只放开「本地网络」这一类（不含公网明文），
        # 比 NSAllowsArbitraryLoads 安全得多。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: 局域网内直连 NAS 同步数据时需要访问本地网络。
        NSPhotoLibraryUsageDescription: 选择照片时会存在本机任务里，并在本机识别照片中的时间，用来快速建任务。
        NSCameraUsageDescription: 拍照会存在本机任务里，并在本机识别照片中的时间，用来快速建任务。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cuiban.app
        PRODUCT_NAME: Cuiban
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: "52"
        MARKETING_VERSION: "1.12.1"
