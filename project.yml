name: Cuiban
options:
  bundleIdPrefix: com.cuiban
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ALWAYS_SEARCH_USER_PATHS: NO

targets:
  Cuiban:
    type: application
    platform: iOS
    sources:
      - path: Cuiban
    dependencies:
      # 小组件扩展：编进主 App 的 PlugIns 目录
      - target: CuibanWidget
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: 催办
        CFBundleName: Cuiban
        # 声明只支持简体中文：系统选择菜单（复制/粘贴/全选）跟随 App 语言，
        # 不声明的话会按手机系统语言显示英文
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations:
          - zh-Hans
        # 小组件点一下要能直接回到那条任务。iOS 16 的小组件没有交互按钮
        # （Button(intent:) 要 17），只能靠 URL scheme 唤回 App 再弹确认页。
        CFBundleURLTypes:
          - CFBundleURLName: com.cuiban.app
            CFBundleURLSchemes:
              - cuiban
        CFBundleShortVersionString: "1.23.4"
        CFBundleVersion: "88"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
          - fetch
        ITSAppUsesNonExemptEncryption: false
        # 同步 NAS 走 WebDAV。局域网内用 http 直连时 ATS 会拦，
        # NSAllowsLocalNetworking 只放开「本地网络」这一类（不含公网明文），
        # 比 NSAllowsArbitraryLoads 安全得多。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: 局域网内直连 NAS 同步数据时需要访问本地网络。
        NSPhotoLibraryUsageDescription: 选择照片时会存在本机任务里，并在本机识别照片中的时间，用来快速建任务。
        NSCameraUsageDescription: 拍照会存在本机任务里，并在本机识别照片中的时间，用来快速建任务。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cuiban.app
        PRODUCT_NAME: Cuiban
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: "88"
        MARKETING_VERSION: "1.23.4"
        # 临界警报（强提醒）权限声明，见 Cuiban/Cuiban.entitlements
        CODE_SIGN_ENTITLEMENTS: Cuiban/Cuiban.entitlements

  # 桌面/锁屏小组件：读 App Group 里主 App 写的「接下来要催什么」快照。
  # 独立进程独立编译，只编 Widget/ 目录，拿不到主 App 代码。
  CuibanWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
    info:
      path: Widget/Info.plist
      properties:
        # 和主 App 版本保持一致（不写的话 XcodeGen 默认 1.0）
        CFBundleShortVersionString: "1.23.4"
        CFBundleVersion: "88"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cuiban.app.widget
        PRODUCT_NAME: CuibanWidget
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: "88"
        MARKETING_VERSION: "1.23.4"
        CODE_SIGN_ENTITLEMENTS: Widget/Widget.entitlements
        SKIP_INSTALL: YES
